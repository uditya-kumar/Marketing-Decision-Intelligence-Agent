# Pre-commit hooks for MDIA. Run: `pre-commit run --all-files`.
# Backend uses Ruff + mypy; frontend uses ESLint + Prettier (run via the project
# toolchains so they see the real dependency graphs).
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.pen$|^requirements/designFile\.pen$'
      - id: end-of-file-fixer
        exclude: '\.pen$'
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: '\.pen$'
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
        files: ^(backend|generator|evaluation)/.*\.py$
      - id: ruff-format
        files: ^(backend|generator|evaluation)/.*\.py$

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && .venv/Scripts/python -m mypy src'
        language: system
        files: ^backend/src/.*\.py$
        pass_filenames: false

      - id: eslint
        name: eslint (frontend)
        entry: bash scripts/frontend-check.sh lint
        language: system
        files: ^frontend/(src/.*\.(ts|tsx)|eslint\.config\.js)$
        pass_filenames: false

      - id: prettier
        name: prettier (frontend)
        entry: bash scripts/frontend-check.sh format
        language: system
        files: ^frontend/(src/.*\.(ts|tsx|css)|.*\.(json|md))$
        pass_filenames: false
