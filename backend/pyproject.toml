[project]
name = "mdia"
version = "0.1.0"
description = "MDIA — Marketing Decision Intelligence Agent (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "structlog>=24.4",
    "python-multipart>=0.0.20",
    "pandas>=3.0.6",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-aws>=0.2",
    "langchain-google-genai>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "hypothesis>=6.115",
    "pre-commit>=4.0",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdia"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "B008", # FastAPI dependency injection uses function calls in defaults
]
allowed-confusables = ["×"]

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy and Pydantic resolve annotations at runtime, so their imports must stay real.
runtime-evaluated-base-classes = ["mdia.db.base.Base", "pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
# "." so the agent tests can import the shared fakes and builders from ``tests/``.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure domain / fast unit tests (no I/O)",
    "integration: hits the Neon 'test' branch; requires DATABASE_URL_TEST",
]
