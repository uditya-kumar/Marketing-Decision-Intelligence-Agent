              - {key: g_sarees_rsa_1, name: RSA | Silk Sarees Festive, weight: 0.5, ctr_factor: 1.0}
              - {key: g_sarees_rsa_2, name: RSA | Everyday Cotton Sarees, weight: 0.5, ctr_factor: 1.0}
      - key: g_pmax_catalogue
        name: NW | PMax | Catalogue
        budget_share: 0.48
        ad_sets:
          - key: g_pmax_women
            name: Asset Group - Women Ethnic
