# Named schedules of injected scenarios. Each event says what breaks (or improves), where and
# when; the generator records it in ground_truth.json, which only evaluation/ may read.
#
#   type     scenario kind (see novawear_sim/scenarios/registry.py)
#   start    first affected day; `days` is the inclusive length
#   target   source / channel / campaign / ad_set / creative (+ device / age_group where used)
#   params   optional overrides of the scenario's defaults

schedules:
  demo:
    description: >-
      Storyline for the dashboard. The backfill ends 2026-10-14 with Meta over-pacing its October
      budget, an Instagram creative fatiguing and PMax showing headroom; batch 1 (10-15..10-21)
      shows the creative recovering after rotation, and batch 2 (10-22..10-28) a Meta tracking break.
    events:
      - {id: demo_01, type: creative_fatigue, start: 2026-07-06, days: 14, target: {creative: ig_reels_young_c1}}
      - {id: demo_02, type: landing_page_break, start: 2026-08-10, days: 4, target: {channel: meta_ads, device: mobile}}
      - {id: demo_03, type: no_issue, start: 2026-08-24, days: 14, target: {}}
      - {id: demo_04, type: audience_mismatch, start: 2026-09-10, days: 10, target: {ad_set: fb_lookalike, age_group: "18-24"}}
      - {id: demo_05, type: channel_opportunity, start: 2026-09-22, days: 40, target: {campaign: g_pmax_catalogue}}
      # 1.38 × 45% of October elapsed on the 14th ≈ 62% of the monthly budget spent.
      - {id: demo_06, type: budget_overpace, start: 2026-10-01, days: 31, target: {channel: meta_ads}, params: {factor: 1.38}}
      - {id: demo_07, type: creative_fatigue, start: 2026-10-04, days: 15, target: {creative: ig_interest_c1}}
      - {id: demo_08, type: tracking_break, start: 2026-10-24, days: 7, target: {source: meta_ads}}

  evaluation:
    description: >-
      Labelled benchmark over 2025-10-15..2026-10-14 (backfill --days 365): 44 injected events and
      7 account-wide no-issue windows (three of them inside Diwali / EOSS, to catch false alarms on
      festive spikes). Events on the same channel never overlap and keep a 3-day gap; injected
      events avoid festive windows so the detected change is the scenario, not the calendar.
    events:
      - {id: eval_01, type: no_issue, start: 2025-10-15, days: 7, target: {}}
      - {id: eval_02, type: channel_opportunity, start: 2025-10-26, days: 10, target: {channel: instagram}}
