[project]
name = "novawear-sim"
version = "0.1.0"
description = "Synthetic marketing data generator for MDIA (fake Meta/Google/GA4/Shopify exports)"
requires-python = ">=3.12,<3.13"
# Analytics/CLI dependencies (pandas, numpy, scipy, pyyaml, pydantic, typer) are
# added in Phase 1 when the generator is built.
dependencies = []

[project.scripts]
# Wired up in Phase 1.12:
# novawear-sim = "novawear_sim.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novawear_sim"]

[tool.ruff]
line-length = 100
target-version = "py312"
