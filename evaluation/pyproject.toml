[project]
name = "mdia-eval"
version = "0.1.0"
description = "MDIA evaluation harness — the only code that reads ground_truth.json"
requires-python = ">=3.12,<3.13"
# Evaluation dependencies (pandas, numpy, matplotlib, scikit-learn, httpx) are
# added in Phase 20 when the evaluation harness is built.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdia_eval"]

[tool.ruff]
line-length = 100
target-version = "py312"
